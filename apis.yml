aid: localstack
name: LocalStack
description: >-
  LocalStack is a cloud service emulator that runs in a single container on your laptop or in your
  CI environment, providing a local test and mocking framework for developing cloud applications
  against AWS, Snowflake, and Azure without provisioning real infrastructure. It ships a CLI, a
  Docker image, IaC integrations (Terraform, CDK, SAM, CloudFormation, Pulumi), an official MCP
  server and Agent Skills, and a local REST API for diagnostics, health checks, service
  introspection, and retrospective access to emulated AWS resources (SES, SNS, SQS, Lambda,
  DynamoDB, EventBridge, CloudWatch). Backed by GGV Capital.
